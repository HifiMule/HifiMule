[workspace]
members = [
    "hifimule-i18n",
    "hifimule-lifecycle",
    "hifimule-daemon",
    "hifimule-ui/src-tauri",
]
exclude = ["third_party/cpal", "third_party/souvlaki"]
resolver = "2"

[workspace.package]
version = "0.20.0"
edition = "2024"
rust-version = "1.99.1"

[workspace.dependencies]
tokio = { version = "~1.54.1", features = ["rt-multi-thread", "macros", "time", "fs", "sync"] }
anyhow = "~1.0.104"
thiserror = "~2.0.21"
rusqlite = { version = "~0.41.0", features = ["bundled"] }
tray-icon = "~0.26.1"
tao = "~0.37.2"
image = { version = "~0.25.10", default-features = false, features = ["png", "jpeg", "ico"] }
# Preserve the native certificate backend; reqwest 0.13 defaults to rustls.
reqwest = { version = "~0.13.5", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy", "json", "stream", "query"] }
serde = { version = "~1.0.229", features = ["derive"] }
serde_json = { version = "~1.0.154", features = ["raw_value"] }
axum = "~0.8.9"
tower-http = { version = "~0.7.1", features = ["cors"] }
http = "~1.5.0"
notify-rust = { version = "~4.18.2", default-features = false, features = ["z"] }
mac-notification-sys = "0.6.15"
cpal = "=0.18.2"
ffmpeg-next = { version = "=9.0.0", default-features = false, features = ["codec", "format", "software-resampling"] }
ffmpeg-sys-next = { version = "=9.0.1", default-features = false, features = ["avcodec", "avformat", "swresample"] }
crossbeam-queue = "=0.3.14"
souvlaki = "=0.8.3"

[patch.crates-io]
cpal = { path = "third_party/cpal" }
souvlaki = { path = "third_party/souvlaki" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
# Tauri patches __TAURI_BUNDLE_TYPE after linking, so release symbols must be
# retained until the bundler has produced each package format.
strip = false
opt-level = "z"

[profile.no-opt]
inherits = "dev"
opt-level = 0
debug = true
debug-assertions = true
overflow-checks = true
