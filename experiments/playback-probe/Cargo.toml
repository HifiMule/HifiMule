[package]
name = "playback-probe"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
native-ffmpeg = ["dep:ffmpeg-next"]

[dependencies]
anyhow = "=1.0.102"
cpal = "=0.16.0"
crossbeam-queue = "=0.3.12"
serde_json = "=1.0.149"
symphonia = { version = "=0.5.5", features = ["all"] }
ffmpeg-next = { version = "=9.0.0", optional = true, default-features = false, features = ["codec", "format"] }
