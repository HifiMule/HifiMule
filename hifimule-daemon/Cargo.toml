[package]
name = "hifimule-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "hifimule-daemon"
path = "src/main.rs"



[dependencies]
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
rusqlite.workspace = true

tray-icon.workspace = true
tao.workspace = true
image.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
hifimule-i18n = { path = "../hifimule-i18n" }
hifimule-lifecycle = { path = "../hifimule-lifecycle" }
axum.workspace = true
tower-http.workspace = true
http.workspace = true
machine-uid = "0.5"
blake3 = "1.5"
sha2 = "0.10"
chacha20poly1305 = "0.10"
secrecy = "0.8"
rand = "0.8"
# Story 13.5: local civil time for the auto-fill Context stage. Default `clock` feature only —
# `chrono::Local::now()` uses `localtime_r` for a sound local offset. Do NOT use the `time` crate's
# `local-offset` feature in this multi-threaded daemon (it returns None/errs by design).
chrono = "0.4"
futures = "0.3"
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4"] }
bytes = "1.0"
md-5 = "0.10"
tracing = "0.1"
tempfile = "3"
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Devices_DeviceAndDriverInstallation"] }
notify-rust.workspace = true
cpal.workspace = true
ffmpeg-next.workspace = true
ffmpeg-sys-next.workspace = true
crossbeam-queue.workspace = true

[target.'cfg(windows)'.dependencies]
# Required by windows 0.58 notification-interface implementation macros.
windows-core = "=0.58.0"
windows-service = "0.7"
windows = { version = "0.58", features = [
    "Win32_Devices_PortableDevices",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "implement",
] }

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
winresource = "0.1"
pkg-config = "0.3"

[dev-dependencies]
mockito = "1.5"

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "=2.30.1"
