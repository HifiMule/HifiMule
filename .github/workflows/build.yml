name: Build

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  playback-session-evidence:
    name: Playback evidence (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            label: windows-x64
          - runner: ubuntu-22.04
            label: linux-x64
          - runner: macos-15-intel
            label: macos-x64
          - runner: macos-15
            label: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Install Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install UI test compiler
        run: npm ci --prefix hifimule-ui --ignore-scripts

      - name: Run packaging and runtime script regressions
        shell: bash
        run: |
          node --test scripts/tests/*.test.mjs
          python -m unittest discover -s scripts/tests -p 'test_playback_session_evidence.py'

      - name: Install Rust 1.93.0
        uses: dtolnay/rust-toolchain@1.93.0

      - name: Install Windows FFmpeg source-build tools
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          install: >-
            make
            sed
            grep
            gawk
            diffutils
            pkgconf
            gnupg
          path-type: inherit

      - name: Select installed MSYS2 toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: '"MSYS2_ROOT=$env:MSYS2_LOCATION" >> $env:GITHUB_ENV'

      - name: Install Linux daemon dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libappindicator3-dev librsvg2-dev libmtp-dev libpulse-dev libasound2-dev libdbus-1-dev libxdo-dev pkgconf build-essential clang libclang-dev libc6-dev nasm curl xz-utils binutils patchelf

      - name: Provision controlled Linux audio runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          TARGET_TRIPLE="$(rustc -vV | sed -n 's/^host: //p')"
          node scripts/linux-audio-runtime.mjs env "$TARGET_TRIPLE" "$GITHUB_ENV"

      - name: Check Linux daemon
        if: runner.os == 'Linux'
        run: npm run build:daemon -- check -p hifimule-daemon

      - name: Provision controlled Windows audio runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $TargetTriple = (rustc -vV | Select-String '^host: ').Line.Substring(6)
          node scripts/windows-audio-runtime.mjs env $TargetTriple $env:GITHUB_ENV

      - name: Install macOS daemon dependencies
        if: runner.os == 'macOS'
        run: brew install pkg-config libmtp nasm

      - name: Provision controlled macOS audio runtime
        if: runner.os == 'macOS'
        shell: bash
        run: |
          TARGET_TRIPLE="$(rustc -vV | sed -n 's/^host: //p')"
          node scripts/macos-audio-runtime.mjs env "$TARGET_TRIPLE" "$GITHUB_ENV"

      - name: Verify Playback selector
        run: npm run build:daemon -- test -p hifimule-daemon playback::selection

      - name: Verify bounded Radio session and restoration
        run: npm run build:daemon -- test -p hifimule-daemon playback::radio::tests

      - name: Verify provider artist ambiguity mapping
        run: |
          npm run build:daemon -- test -p hifimule-daemon jellyfin_item_maps_song_normalized_fields
          npm run build:daemon -- test -p hifimule-daemon multiple_music_artists_are_flagged_for_radio_even_with_a_primary_id

      - name: Verify private recording identity and v9 migration
        run: |
          npm run build:daemon -- test -p hifimule-daemon recording
          npm run build:daemon -- test -p hifimule-daemon v9_radio_membership_migrates_without_guessing_recording_identity

      - name: Verify bounded genre retrieval
        run: npm run build:daemon -- test -p hifimule-daemon playback_genre_fetch_uses_server_side_page_bounds

      - name: Verify Playback start failures preserve the session
        run: npm run build:daemon -- test -p hifimule-daemon playback_selection_setup_and_unavailable_source_preserve_current_session

      - name: Verify Playback audio preparation
        run: npm run build:daemon -- test -p hifimule-daemon selection_preparation_

      - name: Verify Playback owner commit fencing
        run: npm run build:daemon -- test -p hifimule-daemon superseded_selection_is_rejected_at_owner_commit

      - name: Verify source error distinctions
        run: npm run build:daemon -- test -p hifimule-daemon playback_genre_source_distinguishes_removed_source_from_empty_result

      - name: Verify existing auto-fill behavior
        run: npm run build:daemon -- test -p hifimule-daemon auto_fill

      - name: Verify localization
        run: cargo test -p hifimule-i18n

      - name: Verify Playback settings UI
        run: npm run build --prefix hifimule-ui

      - name: Run isolated playback restoration evidence
        env:
          HIFIMULE_EVIDENCE_PATH: playback-evidence/${{ matrix.label }}.json
        run: python scripts/playback-session-evidence.py

      - name: Upload playback evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playback-evidence-${{ matrix.label }}
          path: playback-evidence/${{ matrix.label }}.json
          if-no-files-found: error
