name: Build

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  playback-session-evidence:
    name: Playback evidence (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            label: windows-x64
          - runner: ubuntu-22.04
            label: linux-x64
          - runner: macos-15-intel
            label: macos-x64
          - runner: macos-15
            label: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run packaging and runtime script regressions
        shell: bash
        run: |
          node --test scripts/tests/*.test.mjs
          python -m unittest discover -s scripts/tests -p 'test_playback_session_evidence.py'

      - name: Install Rust 1.93.0
        uses: dtolnay/rust-toolchain@1.93.0

      - name: Install Windows FFmpeg source-build tools
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          install: >-
            make
            sed
            grep
            gawk
            diffutils
            pkgconf
            gnupg
          path-type: inherit

      - name: Select installed MSYS2 toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: '"MSYS2_ROOT=$env:MSYS2_LOCATION" >> $env:GITHUB_ENV'

      - name: Install Linux daemon dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libappindicator3-dev libmtp-dev libasound2-dev libxdo-dev pkgconf build-essential clang libclang-dev libc6-dev nasm curl xz-utils binutils patchelf

      - name: Provision controlled Linux audio runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          TARGET_TRIPLE="$(rustc -vV | sed -n 's/^host: //p')"
          node scripts/linux-audio-runtime.mjs env "$TARGET_TRIPLE" "$GITHUB_ENV"

      - name: Provision controlled Windows audio runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $TargetTriple = (rustc -vV | Select-String '^host: ').Line.Substring(6)
          node scripts/windows-audio-runtime.mjs env $TargetTriple $env:GITHUB_ENV

      - name: Install macOS daemon dependencies
        if: runner.os == 'macOS'
        run: brew install pkg-config libmtp ffmpeg

      - name: Run isolated playback restoration evidence
        env:
          HIFIMULE_EVIDENCE_PATH: playback-evidence/${{ matrix.label }}.json
        run: python scripts/playback-session-evidence.py

      - name: Upload playback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playback-evidence-${{ matrix.label }}
          path: playback-evidence/${{ matrix.label }}.json
          if-no-files-found: error
