name: Smoke Test

# MTP end-to-end detection requires manual hardware verification on each platform. Automated MTP IO coverage is provided by unit tests in device_io.rs.

on:
  workflow_call:
    inputs:
      release_tag:
        description: 'Release tag to test (e.g. v0.1.0)'
        required: false
        type: string
      candidate_version:
        description: 'Candidate version uploaded by the calling release workflow'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to test (e.g. v0.1.0)'
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Draft releases are only listed for callers with push access. Both reusable
# workflow callers must grant this permission even when using candidate artifacts.
permissions:
  contents: write
  actions: read

jobs:
  smoke-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Download MSI artifact
        if: inputs.release_tag != ''
        shell: pwsh
        run: ./scripts/download-release-asset.ps1 -Tag '${{ inputs.release_tag }}' -Pattern '*.msi' -Directory './installers'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download candidate MSI artifact
        if: inputs.candidate_version != ''
        uses: actions/download-artifact@v6
        with:
          name: hifimule-candidate-${{ inputs.candidate_version }}-windows-x64
          path: ./candidate

      - name: Stage candidate MSI
        if: inputs.candidate_version != ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./installers | Out-Null
          Get-ChildItem ./candidate -Filter *.msi -Recurse | Select-Object -First 1 | Copy-Item -Destination ./installers/

      - name: Run smoke test
        working-directory: ./installers
        shell: pwsh
        run: |
          & powershell -ExecutionPolicy Bypass -File ../scripts/smoke-tests/smoke-windows.ps1 2>&1 |
            Tee-Object smoke.log
          exit $LASTEXITCODE

      - name: Upload sanitized lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-log-windows
          path: ./installers/smoke.log
          if-no-files-found: ignore

  smoke-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb jq dbus dbus-x11 libgtk-3-0 libwebkit2gtk-4.1-0 libappindicator3-1

      - name: Download .deb artifact
        if: inputs.release_tag != ''
        shell: pwsh
        run: ./scripts/download-release-asset.ps1 -Tag '${{ inputs.release_tag }}' -Pattern '*.deb' -Directory './installers'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download candidate deb artifact
        if: inputs.candidate_version != ''
        uses: actions/download-artifact@v6
        with:
          name: hifimule-candidate-${{ inputs.candidate_version }}-linux-x64
          path: ./candidate

      - name: Stage candidate deb
        if: inputs.candidate_version != ''
        run: mkdir -p ./installers && find ./candidate -name '*.deb' -type f -print -quit | xargs -I '{}' cp '{}' ./installers/

      - name: Run smoke test
        working-directory: ./installers
        shell: bash
        run: |
          set -o pipefail
          bash ../scripts/smoke-tests/smoke-linux.sh 2>&1 | tee smoke.log

      - name: Upload sanitized lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-log-linux
          path: ./installers/smoke.log
          if-no-files-found: ignore

  smoke-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15-intel
            row: macos-x64
            pattern: '*x64*.dmg'
            log-suffix: macos-intel
          - platform: macos-15
            row: macos-arm64
            pattern: '*aarch64*.dmg'
            log-suffix: macos-arm
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Download DMG artifact
        if: inputs.release_tag != ''
        shell: pwsh
        run: ./scripts/download-release-asset.ps1 -Tag '${{ inputs.release_tag }}' -Pattern '${{ matrix.pattern }}' -Directory './installers'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download candidate DMG artifact
        if: inputs.candidate_version != ''
        uses: actions/download-artifact@v6
        with:
          name: hifimule-candidate-${{ inputs.candidate_version }}-${{ matrix.row }}
          path: ./candidate

      - name: Stage candidate DMG
        if: inputs.candidate_version != ''
        run: mkdir -p ./installers && find ./candidate -name '*.dmg' -type f -print -quit | xargs -I '{}' cp '{}' ./installers/

      - name: Run smoke test
        working-directory: ./installers
        shell: bash
        run: |
          set -o pipefail
          bash ../scripts/smoke-tests/smoke-macos.sh 2>&1 | tee smoke.log

      - name: Upload sanitized lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-log-${{ matrix.log-suffix }}
          path: ./installers/smoke.log
          if-no-files-found: ignore
