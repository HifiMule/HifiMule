name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: 'Exact commit SHA or immutable ref to build'
        required: true
        type: string
      candidate_version:
        description: 'Candidate version (must match Cargo and Tauri)'
        required: true
        default: '0.15.0'
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15-intel
            row: macos-x64
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - platform: macos-15
            row: macos-arm64
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - platform: ubuntu-22.04
            row: linux-x64
            args: ''
            rust-targets: ''
          - platform: windows-latest
            row: windows-x64
            args: --config src-tauri/tauri.windows-signing.conf.json
            rust-targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_ref || github.ref }}

      - name: Install pnpm
        # action-v4.0.0 (latest reviewed for this hardening pass)
        uses: pnpm/action-setup@v4.0.0
        with:
          version: 10.24.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Rust 1.93.0
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Verify candidate identity
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.candidate_version }}
          EXPECTED_REF: ${{ inputs.candidate_ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$EXPECTED_REF^{commit}")"
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)" = "$EXPECTED_VERSION"
          node -e 'const c=require("./hifimule-ui/src-tauri/tauri.conf.json"); if(c.version!==process.env.EXPECTED_VERSION) process.exit(1)'

      - name: Install Windows FFmpeg source-build tools
        if: matrix.platform == 'windows-latest'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          install: >-
            make
            sed
            grep
            gawk
            diffutils
            pkgconf
            gnupg
          path-type: inherit

      - name: Select installed MSYS2 toolchain
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: '"MSYS2_ROOT=$env:MSYS2_LOCATION" >> $env:GITHUB_ENV'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libpulse-dev libasound2-dev libdbus-1-dev \
            build-essential \
            nasm \
            clang \
            libclang-dev \
            libc6-dev \
            curl \
            xz-utils \
            binutils \
            pkgconf \
            libxdo-dev \
            libmtp-dev
          pkg-config --libs libmtp
          test -n "$(find /usr/lib -name 'libmtp.so.9' -print -quit)"

      - name: Install macOS dependencies
        if: startsWith(matrix.platform, 'macos')
        run: |
          brew install pkg-config libmtp nasm
          LIBMTP_PREFIX="$(brew --prefix libmtp)"
          LIBMTP_PC_DIR="$LIBMTP_PREFIX/lib/pkgconfig"

          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH_aarch64_apple_darwin=$LIBMTP_PC_DIR" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH_x86_64_apple_darwin=$LIBMTP_PC_DIR" >> "$GITHUB_ENV"
          pkg-config --libs libmtp
          LIBMTP_DYLIB="$(find "$LIBMTP_PREFIX/lib" -name 'libmtp*.dylib' -print -quit)"
          test -n "$LIBMTP_DYLIB"
          lipo "$LIBMTP_DYLIB" -verify_arch "$(uname -m)"

      - name: Provision controlled macOS audio runtime
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          TARGET_TRIPLE="$(rustc -vV | sed -n 's/^host: //p')"
          node scripts/macos-audio-runtime.mjs env "$TARGET_TRIPLE" "$GITHUB_ENV"

      - name: Configure optional Windows Authenticode signing
        if: matrix.platform == 'windows-latest'
        id: windows_signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $CredentialValues = @($env:WINDOWS_CERTIFICATE_BASE64, $env:WINDOWS_CERTIFICATE_PASSWORD)
          $ConfiguredCount = @($CredentialValues | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }).Count
          if ($ConfiguredCount -eq 0) {
            Set-Content -Path hifimule-ui/src-tauri/tauri.windows-signing.conf.json -Value '{}' -Encoding utf8
            'enabled=false' >> $env:GITHUB_OUTPUT
            Write-Host 'Windows Authenticode credentials are not configured; building unsigned MSI and NSIS artifacts. Authenticode verification will be skipped.'
            exit 0
          }
          if ($ConfiguredCount -ne $CredentialValues.Count) {
            throw 'Windows Authenticode credentials are partially configured; both WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD are required when signing is enabled'
          }
          $CertificatePath = Join-Path $env:RUNNER_TEMP 'hifimule-signing.pfx'
          [IO.File]::WriteAllBytes($CertificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $Password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $Certificate = Import-PfxCertificate -FilePath $CertificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $Password
          if (-not $Certificate.Thumbprint) { throw 'Imported certificate has no thumbprint' }
          $Config = @{ bundle = @{ windows = @{ certificateThumbprint = $Certificate.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com' } } } | ConvertTo-Json -Depth 5
          Set-Content -Path hifimule-ui/src-tauri/tauri.windows-signing.conf.json -Value $Config -Encoding utf8
          'enabled=true' >> $env:GITHUB_OUTPUT

      - name: Configure optional macOS Developer ID signing and notarization
        if: startsWith(matrix.platform, 'macos')
        id: macos_signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          names=(APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID)
          configured=0
          missing=()
          for name in "${names[@]}"; do
            value="${!name:-}"
            if [[ -n "${value//[[:space:]]/}" ]]; then
              configured=$((configured + 1))
            else
              missing+=("$name")
            fi
          done
          if [[ "$configured" -eq 0 ]]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Apple signing and notarization credentials are not configured; building unsigned app and DMG artifacts. Developer ID and notarization verification will be skipped.'
          elif [[ "$configured" -ne "${#names[@]}" ]]; then
            echo "Apple signing and notarization credentials are partially configured; missing: ${missing[*]}" >&2
            exit 1
          else
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Install frontend dependencies
        working-directory: hifimule-ui
        run: pnpm install

      - name: Stage daemon sidecar
        run: node scripts/prepare-sidecar.mjs

      - name: Check macOS minimum system version reminder
        if: startsWith(matrix.platform, 'macos')
        run: node scripts/check-macos-minimum-system-version.mjs

      - name: Build immutable candidate
        if: github.event_name == 'workflow_dispatch' && !startsWith(matrix.platform, 'macos')
        working-directory: hifimule-ui
        env:
          HIFIMULE_SKIP_SIDECAR_PREP: "1"
        run: pnpm exec tauri build ${{ matrix.args }}

      - name: Build signed macOS immutable candidate
        if: github.event_name == 'workflow_dispatch' && startsWith(matrix.platform, 'macos') && steps.macos_signing.outputs.enabled == 'true'
        working-directory: hifimule-ui
        env:
          HIFIMULE_SKIP_SIDECAR_PREP: "1"
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm exec tauri build ${{ matrix.args }}

      - name: Build unsigned macOS immutable candidate
        if: github.event_name == 'workflow_dispatch' && startsWith(matrix.platform, 'macos') && steps.macos_signing.outputs.enabled == 'false'
        working-directory: hifimule-ui
        env:
          HIFIMULE_SKIP_SIDECAR_PREP: "1"
        run: |
          unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          pnpm exec tauri build ${{ matrix.args }}

      - name: Build draft release
        if: github.event_name == 'push' && !startsWith(matrix.platform, 'macos')
        # action-v0.6.2 (latest reviewed for this hardening pass)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HIFIMULE_SKIP_SIDECAR_PREP: "1"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'HifiMule ${{ github.ref_name }}'
          releaseBody: 'See the release notes for details.'
          releaseDraft: true
          prerelease: false
          projectPath: hifimule-ui
          args: ${{ matrix.args }}

      - name: Build signed macOS draft release
        if: github.event_name == 'push' && startsWith(matrix.platform, 'macos') && steps.macos_signing.outputs.enabled == 'true'
        # action-v0.6.2 (latest reviewed for this hardening pass)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HIFIMULE_SKIP_SIDECAR_PREP: "1"
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'HifiMule ${{ github.ref_name }}'
          releaseBody: 'See the release notes for details.'
          releaseDraft: true
          prerelease: false
          projectPath: hifimule-ui
          args: ${{ matrix.args }}

      - name: Build unsigned macOS draft release
        if: github.event_name == 'push' && startsWith(matrix.platform, 'macos') && steps.macos_signing.outputs.enabled == 'false'
        # action-v0.6.2 (latest reviewed for this hardening pass)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HIFIMULE_SKIP_SIDECAR_PREP: "1"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'HifiMule ${{ github.ref_name }}'
          releaseBody: 'See the release notes for details.'
          releaseDraft: true
          prerelease: false
          projectPath: hifimule-ui
          args: ${{ matrix.args }}

      - name: Verify Linux AppImage bundles private daemon libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          TARGET_DIRS=()
          for dir in target hifimule-ui/src-tauri/target; do
            if [[ -d "$dir" ]]; then
              TARGET_DIRS+=("$dir")
            fi
          done
          test "${#TARGET_DIRS[@]}" -gt 0 || { echo "No Tauri target directory found"; exit 1; }
          APPIMAGE="$(find "${TARGET_DIRS[@]}" -path '*/release/bundle/*' -name '*.AppImage' -print -quit)"
          test -n "$APPIMAGE" || { echo "AppImage artifact not found"; exit 1; }
          chmod +x "$APPIMAGE"
          rm -rf squashfs-root
          "$APPIMAGE" --appimage-extract >/dev/null
          TARGET_TRIPLE="$(rustc -vV | sed -n 's/^host: //p')"
          node scripts/linux-audio-runtime.mjs verify-bundle "$TARGET_TRIPLE" squashfs-root
          rm -rf squashfs-root

      - name: Verify Linux deb bundles a resolvable private daemon closure
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          DEB="$(find target hifimule-ui/src-tauri/target -path '*/release/bundle/*' -name '*.deb' -print -quit 2>/dev/null)"
          test -n "$DEB" || { echo "Deb artifact not found"; exit 1; }
          rm -rf deb-root
          dpkg-deb -x "$DEB" deb-root
          TARGET_TRIPLE="$(rustc -vV | sed -n 's/^host: //p')"
          node scripts/linux-audio-runtime.mjs verify-bundle "$TARGET_TRIPLE" deb-root
          rm -rf deb-root

      - name: Verify macOS controlled runtime bundle
        if: startsWith(matrix.platform, 'macos')
        run: |
          set -euo pipefail
          TARGET_DIRS=()
          for dir in target hifimule-ui/src-tauri/target; do
            if [[ -d "$dir" ]]; then
              TARGET_DIRS+=("$dir")
            fi
          done
          test "${#TARGET_DIRS[@]}" -gt 0 || { echo "No Tauri target directory found"; exit 1; }
          APP_DIR="$(find "${TARGET_DIRS[@]}" -path '*.app' -type d -print -quit)"
          test -n "$APP_DIR" || { echo ".app bundle not found"; exit 1; }
          TARGET_TRIPLE="$(rustc -vV | sed -n 's/^host: //p')"
          node scripts/macos-audio-runtime.mjs verify-bundle "$TARGET_TRIPLE" "$APP_DIR"

      - name: Verify macOS Developer ID and notarization
        if: startsWith(matrix.platform, 'macos') && steps.macos_signing.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          TARGET_DIRS=()
          for dir in target hifimule-ui/src-tauri/target; do
            if [[ -d "$dir" ]]; then
              TARGET_DIRS+=("$dir")
            fi
          done
          test "${#TARGET_DIRS[@]}" -gt 0 || { echo "No Tauri target directory found"; exit 1; }
          APP_DIR="$(find "${TARGET_DIRS[@]}" -path '*.app' -type d -print -quit)"
          test -n "$APP_DIR" || { echo ".app bundle not found"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP_DIR"
          codesign -dv --verbose=4 "$APP_DIR" 2>&1 | grep -q 'Authority=Developer ID Application:'
          codesign -dv --verbose=2 "$APP_DIR" 2>&1 | grep -q 'Sealed Resources' || {
            echo "Bundle signature is missing sealed resources"
            codesign -dv --verbose=2 "$APP_DIR" 2>&1
            exit 1
          }
          spctl --assess --type execute --verbose=4 "$APP_DIR"
          DMG="$(find "${TARGET_DIRS[@]}" -path '*/release/bundle/*' -name '*.dmg' -print -quit)"
          test -n "$DMG" || { echo 'DMG artifact not found'; exit 1; }
          xcrun stapler validate "$DMG"

      - name: Verify Windows installed audio bundle
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $Msi = Get-ChildItem target,hifimule-ui/src-tauri/target -Filter *.msi -Recurse | Select-Object -First 1
          if (-not $Msi) { throw 'MSI artifact not found' }
          $Extracted = Join-Path $env:RUNNER_TEMP 'hifimule-msi'
          New-Item -ItemType Directory -Force $Extracted | Out-Null
          $Process = Start-Process msiexec.exe -ArgumentList "/a `"$($Msi.FullName)`" /qn TARGETDIR=`"$Extracted`"" -Wait -PassThru
          if ($Process.ExitCode -ne 0) { throw "MSI administrative extraction failed: $($Process.ExitCode)" }
          node scripts/windows-audio-runtime.mjs verify-bundle x86_64-pc-windows-msvc $Extracted

      - name: Verify Windows Authenticode signatures
        if: matrix.platform == 'windows-latest' && steps.windows_signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $Artifacts = Get-ChildItem target,hifimule-ui/src-tauri/target -Recurse -File | Where-Object { $_.Extension -in '.msi', '.exe' -and $_.FullName -match '[\\/]bundle[\\/]' }
          if (($Artifacts | Measure-Object).Count -lt 2) { throw 'Both MSI and NSIS artifacts are required' }
          foreach ($Artifact in $Artifacts) {
            $Signature = Get-AuthenticodeSignature $Artifact.FullName
            if ($Signature.Status -ne 'Valid' -or -not $Signature.SignerCertificate) { throw "Invalid Authenticode signature: $($Artifact.FullName) ($($Signature.Status))" }
          }

      - name: Write immutable candidate checksums
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          CANDIDATE_ROW: ${{ matrix.row }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        run: |
          set -euo pipefail
          mkdir -p candidate-metadata
          find target hifimule-ui/src-tauri/target -path '*/release/bundle/*' -type f -print0 2>/dev/null \
            | sort -z \
            | xargs -0 shasum -a 256 > "candidate-metadata/${CANDIDATE_ROW}-${CANDIDATE_VERSION}.sha256"
          test -s "candidate-metadata/${CANDIDATE_ROW}-${CANDIDATE_VERSION}.sha256"
          git rev-parse HEAD > "candidate-metadata/${CANDIDATE_ROW}-${CANDIDATE_VERSION}.source-revision"

      - name: Upload immutable candidate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: hifimule-candidate-${{ inputs.candidate_version }}-${{ matrix.row }}
          path: |
            target/**/release/bundle/**/*
            hifimule-ui/src-tauri/target/**/release/bundle/**/*
            candidate-metadata/*
          if-no-files-found: error
          retention-days: 30

  smoke-release:
    if: github.event_name == 'push'
    needs: release
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/smoke-test.yml
    with:
      release_tag: ${{ github.ref_name }}
    secrets: inherit

  smoke-candidate:
    if: github.event_name == 'workflow_dispatch'
    needs: release
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/smoke-test.yml
    with:
      candidate_version: ${{ inputs.candidate_version }}
    secrets: inherit
