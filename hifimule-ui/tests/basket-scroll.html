<!doctype html>
<html lang="en" class="sl-theme-dark">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Basket scroll regression checks</title>
<style>
  body { overflow:auto !important; }
  main { max-width:760px; margin:24px auto; padding:16px; }
  #basket { display:block; width:400px; height:550px; overflow-y:auto; padding:16px; box-sizing:border-box; }
  #basket.compact { width:300px; height:300px; }
  #basket .basket-items-list { display:block; height:250px; min-height:250px; overflow-y:auto; }
  #basket .basket-item-card { height:64px; box-sizing:border-box; }
  #result { display:block; white-space:pre-wrap; margin-top:16px; }
</style>
<main><h1>Basket scroll</h1><p>Runs the actual sidebar render and cross handler against an isolated in-memory selection. Device services and polling are omitted. Enable the reduced-motion option to run the same checks with a deterministic motion preference.</p>
<label><input type="checkbox" id="reduced"> Reduced motion</label> <button id="check">Run checks</button><section id="basket" aria-label="Device basket"></section><output id="result" aria-live="polite"></output></main>
<script type="module">
import '@shoelace-style/shoelace/dist/themes/dark.css';
import '../src/shoelace';
import '../src/styles.css';
import { BasketSidebar } from '../src/components/BasketSidebar.ts';
import { basketStore } from '../src/state/basket.ts';
import { setLanguage, t } from '../src/i18n.ts';
await setLanguage(new URLSearchParams(location.search).get('lang') || 'en');
const basket = document.querySelector('#basket'), result = document.querySelector('#result');
// Skip the constructor's daemon polling; retain production renderContent, item markup,
// cross handlers, capacity calculation, and animation helpers.
const sidebar = Object.create(BasketSidebar.prototype);
Object.assign(sidebar, {
  container: basket, selectedDevicePath: '/fixture/device-a', isDestroyed: false,
  currentDevice: null, storageInfo: {totalBytes: 100e9, freeBytes: 80e9, usedBytes: 20e9},
  autoFillPipelines: new Map(), serversById: new Map(),
  updateDeviceLockState() {}, mountDestinationHub() {}, loadBasketImages() {},
  bindAutoFillEvents() {}, bindDeviceHubEvents() {},
  renderDestinationChooserHost: () => '', renderAutoFillControls: () => '',
  renderStatusZone: () => '', renderDeviceFolders: () => '',
});
let items = [];
basketStore.getItems = () => items;
basketStore.hasMultipleServers = () => false;
basketStore.isItemLocked = () => false;
basketStore.admitPhysicalTargetMutation = () => true;
basketStore.remove = id => { items = items.filter(item => item.id !== id); sidebar.render(); return true; };
const list = () => basket.querySelector('.basket-items-list');
const maxScroll = element => element.scrollHeight - element.clientHeight;
const seed = (count = 40) => {
  items = Array.from({length: count}, (_, i) => ({id: `album-${i}`, name: `Album ${i + 1}`, type: 'MusicAlbum', childCount: 10, sizeTicks: 0, sizeBytes: 1e9}));
  sidebar.motionDevicePath = undefined;
  sidebar.render();
};
async function removeVisible() {
  const bounds = list().getBoundingClientRect();
  const row = [...list().querySelectorAll('.basket-item-card')].find(row => {
    const rect = row.getBoundingClientRect();
    return rect.top >= bounds.top && rect.bottom <= bounds.bottom;
  });
  if (!row) throw new Error('Fixture needs a fully visible row');
  const id = row.dataset.id;
  const button = row.querySelector('.remove-item-btn');
  await button.updateComplete;
  button.click();
  return id;
}
document.querySelector('#check').onclick = async () => {
  const lines = [];
  const originalMatchMedia = window.matchMedia;
  const forceReduced = document.querySelector('#reduced').checked;
  if (forceReduced) {
    window.matchMedia = query => {
      const media = originalMatchMedia.call(window, query);
      if (query === '(prefers-reduced-motion: reduce)') Object.defineProperty(media, 'matches', {value: true});
      return media;
    };
  }
  const assert = (ok, label) => { lines.push(`${ok ? 'PASS' : 'FAIL'}: ${label}`); result.textContent = lines.join('\n'); };
  const settle = () => Promise.allSettled(basket.getAnimations({subtree:true}).map(a => a.finished));
  try {
    sidebar.selectedDevicePath = '/fixture/device-a';
    basket.classList.remove('compact'); seed();
    list().scrollTop = 600;
    assert(list().scrollTop === 600, 'fixture has real list overflow');
    const summary = basket.querySelector('.basket-summary').textContent;
    const capacity = basket.querySelector('.capacity-projected').style.cssText;
    const removed = await removeVisible();
    assert(!basket.querySelector(`[data-id="${removed}"]`), 'cross removes selected item');
    assert(list().scrollTop === 600, 'middle removal preserves list offset synchronously');
    assert(basket.querySelector('.basket-header sl-badge').textContent === '39', 'count updates');
    assert(basket.querySelector('.basket-summary').textContent !== summary && basket.querySelector('.capacity-projected').style.cssText !== capacity, 'summary and capacity update');
    list().scrollTop = 720; sidebar.render();
    assert(list().scrollTop === 720, 'refresh captures current offset instead of stale offset');
    await removeVisible();
    assert(list().scrollTop === 720, 'repeated removal preserves offset');
    list().scrollTop = maxScroll(list());
    const oldBottom = list().scrollTop;
    await removeVisible();
    assert(list().scrollTop > 0 && list().scrollTop < oldBottom && list().scrollTop === maxScroll(list()), 'bottom removal clamps to shorter list');
    basket.classList.add('compact'); seed();
    list().scrollTop = 600; basket.scrollTop = 80;
    const panelOffset = basket.scrollTop;
    assert(panelOffset > 0, 'compact fixture has real outer overflow');
    await removeVisible();
    assert(list().scrollTop === 600 && basket.scrollTop === panelOffset, 'compact removal preserves both scroll containers');
    await settle();
    assert(list().scrollTop === 600 && basket.scrollTop === panelOffset, 'animation completion does not override scroll');
    const animate = basket.animate;
    basket.animate = undefined;
    await removeVisible();
    assert(list().scrollTop === 600 && basket.scrollTop === panelOffset, 'scroll restoration works without animation support');
    basket.animate = animate;
    sidebar.selectedDevicePath = '/fixture/device-b'; sidebar.render();
    assert(list().scrollTop === 0, 'device switch does not inherit list offset');
    seed(1);
    const lastButton = basket.querySelector('.remove-item-btn');
    await lastButton.updateComplete;
    lastButton.click();
    assert(!list() && !!basket.querySelector('.basket-placeholder'), 'last removal renders empty state safely');
    sidebar.render();
    assert(!list(), 'refresh safely handles absent list');
    seed(3);
    const focusRemove = async index => {
      const control = basket.querySelectorAll('.remove-item-btn')[index];
      await control.updateComplete;
      control.focus();
      return control;
    };
    const settleFocus = async () => {
      await Promise.all([...basket.querySelectorAll('.remove-item-btn')].map(control => control.updateComplete));
      await Promise.resolve();
    };
    await focusRemove(1); sidebar.render(); await settleFocus();
    assert(document.activeElement?.dataset.id === 'album-1', 'refresh preserves the focused item');
    document.activeElement.click(); await settleFocus();
    assert(document.activeElement?.dataset.id === 'album-2', 'removal focuses the next item');
    document.activeElement.click(); await settleFocus();
    assert(document.activeElement?.dataset.id === 'album-0', 'last-row removal focuses the previous item');
    document.activeElement.click(); await settleFocus();
    assert(document.activeElement?.classList.contains('basket-placeholder'), 'last-item removal focuses the empty state');
    seed(3); await focusRemove(0); sidebar.render();
    document.querySelector('#check').focus(); await settleFocus();
    assert(document.activeElement === document.querySelector('#check'), 'pending restoration does not steal focus');
    items[0].name = 'Album "quoted" & <special> 🎵'; sidebar.render();
    assert(basket.querySelector('.remove-item-btn').label === t('basket.actions.remove_named', {name: items[0].name}), 'removal name preserves special characters');
    assert(basket.querySelector('#sync-mode-dropdown [slot="trigger"]').textContent === t('basket.actions.sync_options'), 'sync-options trigger has a localized name');
    seed();
    result.textContent = lines.join('\n') + `\nMotion preference: ${matchMedia('(prefers-reduced-motion: reduce)').matches ? 'reduced' : 'standard'}`;
  } catch (error) { result.textContent = lines.join('\n') + `\nFAIL: ${error.stack}`; }
  finally { window.matchMedia = originalMatchMedia; }
};
seed();
</script></html>
