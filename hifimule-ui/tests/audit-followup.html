<!doctype html>
<html lang="en" class="sl-theme-dark">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audit follow-up checks</title>
<style>body{overflow:auto!important}main{max-width:900px;padding:24px}#basket{height:240px;overflow:auto;max-width:420px}#basket .basket-item-card{min-height:60px}#actions{display:flex;align-items:center;gap:16px}output{display:block;margin:16px 0}</style>
<main><h1>Audit follow-up checks</h1><p>Fixture data · production artwork loader and playback buttons</p>
<div id="browse-mode-bar"><div class="browse-mode-bar"><sl-button>Albums</sl-button><sl-button>Recently added</sl-button></div></div>
<h2>Playback actions</h2><div id="actions"></div><sl-button id="finish">Complete pending request</sl-button>
<h2>Basket artwork</h2><output id="requests">Artwork requests: 0</output><sl-button id="redraw">Redraw basket</sl-button><div id="basket"></div></main>
<script type="module">
import '@shoelace-style/shoelace/dist/themes/dark.css';
import '../src/shoelace';
import '../src/styles.css';
import {setBasePath} from '@shoelace-style/shoelace/dist/utilities/base-path.js';
setBasePath('/node_modules/@shoelace-style/shoelace/dist');
let resolve;
window.__TAURI_INTERNALS__={invoke:async (_command,{method})=>{
 if(method==='playback.playPlaylist'||method==='playback.applySession')return new Promise(r=>resolve=()=>r({}));
 return {data:{}};
}};
const {createPlaylistPlayButton}=await import('../src/components/PlaylistPlayButton.ts');
const {createTrackQueueButton}=await import('../src/components/TrackQueueButton.ts');
const {BasketArtwork}=await import('../src/components/basketArtwork.ts');
const {setLanguage}=await import('../src/i18n.ts');await setLanguage('en');
document.querySelector('#actions').append(createPlaylistPlayButton('playlist','server','Fixture playlist'),createTrackQueueButton('server','track','Fixture track'));
document.querySelector('#finish').onclick=()=>resolve?.();
let requests=0;
const artwork=new BasketArtwork(async()=>{document.querySelector('#requests').textContent=`Artwork requests: ${++requests} / 40 rows`;return 'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48"><rect width="48" height="48" fill="#22b8f0"/></svg>');});
const basket=document.querySelector('#basket');
function draw(){artwork.disconnect();basket.innerHTML=Array.from({length:40},(_,i)=>`<div class="basket-item-card"><div class="basket-item-image" data-image-id="${i}"></div><div class="basket-item-info"><div class="basket-item-name">Fixture album ${i+1}</div><div class="basket-item-meta">12 tracks</div></div></div>`).join('');artwork.mount(basket,'server');}
document.querySelector('#redraw').onclick=draw;draw();
</script></html>
