<!doctype html>
<html lang="en" class="sl-theme-dark">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Library loading and direct playback checks</title>
<style>body{overflow:auto!important}main{max-width:900px;margin:auto;padding:24px}#library-content{height:300px;overflow:auto}#results{white-space:pre-wrap;overflow-wrap:anywhere}#actions{display:flex;gap:16px;margin:16px 0}</style>
<main><h1>Loading and playback feedback</h1><p>Fixture data · production components · no server writes</p><pre id="results" role="status">Running…</pre><div id="actions"></div><div id="browse-mode-bar"></div><div id="library-content"></div></main>
<script type="module">
import '@shoelace-style/shoelace/dist/themes/dark.css';
import '../src/shoelace';
import '../src/styles.css';
import {setBasePath} from '@shoelace-style/shoelace/dist/utilities/base-path.js';
setBasePath('/node_modules/@shoelace-style/shoelace/dist');
const memory=new Map();Object.defineProperty(window,'localStorage',{value:{getItem:k=>memory.get(k)??null,setItem:(k,v)=>memory.set(k,String(v)),removeItem:k=>memory.delete(k)}});
const params=new URLSearchParams(location.search);
if(params.get('zoom')==='200')document.documentElement.style.fontSize='32px';
const pending=[];let rejectBrowse=false,empty=false,pageFailure=false,playCalls=0;
window.__TAURI_INTERNALS__={invoke:async(command,args)=>{
 if(command==='image_proxy')return '';
 const {method,params:p}=args??{};
 if(method==='browse.listModes')return {modes:['artists']};
 if(method==='server.list')return [{id:'server',serverId:'server',name:'Fixture',serverType:'jellyfin',selected:true}];
 if(method==='browse.listArtists'){
  if(rejectBrowse||(pageFailure&&p.startIndex>0))throw Error('Fixture offline');
  await new Promise(r=>pending.push(r));
  return {artists:empty?[]:[{id:'artist',name:'夜の音楽 🎵',albumCount:2}],total:empty?0:2};
 }
 if(method==='playback.getSession')return {data:{instanceId:'fixture',sessionId:'session',queueRevision:'1'}};
 if(method==='playback.applySession'){playCalls++;return new Promise((resolve,reject)=>pending.push({resolve,reject}));}
 return {};
}};
const {setLanguage,t}=await import('../src/i18n.ts');await setLanguage(params.get('lang')||'en');
const {initLibraryView}=await import('../src/library.ts');
const {createTrackPlayButton}=await import('../src/components/TrackPlayButton.ts');
const lines=[],content=document.querySelector('#library-content');
const frame=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
const check=(ok,label)=>{lines.push(`${ok?'PASS':'FAIL'} ${label}`);document.querySelector('#results').textContent=lines.join('\n');if(!ok)throw Error(label);};
const status=()=>content.previousElementSibling;
async function load(){const result=initLibraryView();await frame();return {result};}
try{
 let run=await load();const region=status();
 check(region.getAttribute('role')==='status'&&region.textContent===t('library.loading.pending')&&content.getAttribute('aria-busy')==='true','Persistent live region announces pending load');
 pending.shift()();await run.result;await frame();
 check(status()===region&&region.textContent===t('library.loading.complete',{count:1})&&content.getAttribute('aria-busy')==='false','Completed load announces count and releases busy state');
 empty=true;run=await load();pending.shift()();await run.result;await frame();
 check(status()===region&&region.textContent===t('library.loading.empty'),'Empty results reuse the live region');
 rejectBrowse=true;await initLibraryView();await frame();
 check(region.textContent===t('library.loading.failed')&&content.getAttribute('aria-busy')==='false','Failure releases busy state and does not announce success');
 rejectBrowse=false;empty=false;run=await load();pending.shift()();await run.result;await frame();
 check(region.textContent===t('library.loading.complete',{count:1}),'Retry recovers after failure');
 pageFailure=true;document.querySelector('[data-view="list"]').click();await frame();
 content.dispatchEvent(new Event('scroll'));await frame();
 check(region.textContent===t('library.loading.failed')&&content.getAttribute('aria-busy')==='false'&&content.querySelector('.media-list-row'),'Pagination failure preserves rows and announces failure');
 pageFailure=false;
 for(const kind of ['track','part']){
  const play=createTrackPlayButton('server',kind,'夜の音楽 🎵',kind);document.querySelector('#actions').append(play);await play.updateComplete;
  const before=playCalls;play.focus();play.click();play.click();await frame();
  check(playCalls===before+1&&play.disabled&&play.shadowRoot.querySelector('button').disabled&&play.getAttribute('aria-busy')==='true',`${kind}: duplicate activation blocked, including shadow control`);
  pending.shift().reject(Error('Fixture offline'));await frame();
  check(!play.disabled&&!play.hasAttribute('aria-busy')&&play.name==='play-fill',`${kind}: failure unlocks retry and restores icon`);
  play.click();await frame();pending.shift().resolve();await frame();
  check(!play.disabled&&play.label.includes('夜の音楽'),`${kind}: success restores descriptive label`);
 }
 check(document.documentElement.scrollWidth<=innerWidth,'No horizontal overflow');
 document.querySelector('#results').textContent+='\nREADY';
}catch(error){document.querySelector('#results').textContent+='\n'+error.stack;throw error;}
</script></html>
