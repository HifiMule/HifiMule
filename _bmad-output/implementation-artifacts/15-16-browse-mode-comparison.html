</style><h1>Story 15.16 — isolated design comparison</h1><p>Real locally installed Shoelace controls; source-equivalent baseline layout. This prototype does not certify application behavior or installed platforms.</p><label>Column width <input id="width" type="number" value="720"></label><label>Language <select id="lang"><option>en</option><option>fr</option><option>es</option><option>de</option></select></label><label>Text scale <select id="scale"><option value="1">100%</option><option value="2">200%</option></select></label><h2>Before</h2><section><div class="bar before"><div class="modes"></div><div class="toggle"></div></div></section><h2>Proposed</h2><section><div class="bar after"><div class="modes"></div><div class="toggle"></div></div></section><pre id="metrics"></pre>
